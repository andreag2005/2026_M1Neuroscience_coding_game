<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Box Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Push Box Puzzle</h1>
        
        <div class="stats">
            <div class="stat">
                <span>Level:</span>
                <span id="level">1</span>
            </div>
            <div class="stat">
                <span>Moves:</span>
                <span id="moves">0</span>
            </div>
            <div class="stat">
                <span>Best:</span>
                <span id="best">-</span>
            </div>
        </div>

        <div id="gameBoard" class="game-board"></div>

        <div class="controls">
            <p>Use arrow keys or WASD to move</p>
            <button id="resetBtn" class="btn">Reset Level</button>
            <button id="nextBtn" class="btn" style="display:none;">Next Level</button>
        </div>

        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>🧑 = Player</li>
                <li>📦 = Box to push</li>
                <li>🎯 = Target square</li>
                <li>Push the box onto the target to complete the level</li>
            </ul>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
